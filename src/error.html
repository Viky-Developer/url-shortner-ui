<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% | Linkpluse</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
			}
			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				background: #13121b;
				color: #e4e1ee;
				padding: 24px;
				box-sizing: border-box;
			}
			main {
				width: min(100%, 520px);
				box-sizing: border-box;
				padding: 48px 32px;
				border: 1px solid #35343e;
				border-radius: 18px;
				background: #18181b;
				text-align: center;
				box-shadow: 0 24px 80px rgb(0 0 0 / 0.28);
			}
			img {
				width: 64px;
				height: 64px;
				border-radius: 16px;
			}
			.status {
				margin: 28px 0 0;
				color: #c3c0ff;
				font:
					600 13px ui-monospace,
					monospace;
				letter-spacing: 0.18em;
				text-transform: uppercase;
			}
			h1 {
				margin: 12px 0 0;
				font-size: clamp(28px, 7vw, 40px);
				line-height: 1.1;
			}
			.message {
				margin: 16px auto 0;
				max-width: 400px;
				color: #bcbbc5;
				font-size: 14px;
				line-height: 1.65;
			}
			a {
				display: inline-flex;
				margin-top: 30px;
				min-height: 40px;
				align-items: center;
				border-radius: 9px;
				background: #c3c0ff;
				color: #1d00a5;
				padding: 0 20px;
				font-size: 14px;
				font-weight: 600;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 3px solid #818cf8;
				outline-offset: 3px;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/favicon.svg" alt="" />
			<p class="status">Error %sveltekit.status%</p>
			<h1>Linkpluse is temporarily unavailable</h1>
			<p class="message">
				The application could not start right now. Please try again shortly or return to sign in.
			</p>
			<a href="/login">Go to sign in</a>
		</main>
	</body>
</html>
