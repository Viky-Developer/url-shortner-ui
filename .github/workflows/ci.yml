name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'hotfix/*'
      - 'release/*'
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi

          case "$BASE_REF:$HEAD_REF" in
            main:hotfix/*|main:release/*)
              ;;
            dev:bug/*|dev:fix/*|dev:chore/*|dev:refactor/*|dev:feat/*)
              ;;
            main:*)
              echo "::error::Pull requests into main must come from a hotfix/* or release/* branch."
              exit 1
              ;;
            dev:*)
              echo "::error::Pull requests into dev must come from a bug/*, fix/*, chore/*, refactor/*, or feat/* branch."
              exit 1
              ;;
          esac

  lint:
    name: lint
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

  build:
    name: build
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: test
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: E2E tests
        run: npx playwright test
